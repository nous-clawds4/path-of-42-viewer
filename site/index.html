<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Path of 42 · question-graph viewer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1l7 7-7 7-7-7z' fill='%234f46e5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="bar">
  <div class="brand"><span class="logo">◆</span> The Path of 42 <span id="graph-title" class="muted"></span></div>
  <span id="data-badge" class="data-badge" hidden title=""></span>
  <div class="controls">
    <input id="search" type="search" placeholder="Search nodes…" autocomplete="off" aria-label="Search nodes">
    <label class="toggle"><input id="show-rejected" type="checkbox" checked> Show rejected</label>
    <label>Paper version
      <select id="version"><option value="">(none)</option></select>
    </label>
    <div class="btns">
      <button id="zoom-in" title="Zoom in">+</button>
      <button id="zoom-out" title="Zoom out">−</button>
      <button id="fit" title="Fit graph to window">Fit</button>
      <button id="relayout" title="Re-run layout">Layout</button>
    </div>
  </div>
</header>
<div id="data-note" class="data-note" hidden></div>
<main>
  <div id="cy" aria-label="Question graph"></div>
  <aside id="panel" hidden>
    <button id="panel-close" class="close" title="Close" aria-label="Close panel">×</button>
    <div id="panel-body"></div>
  </aside>
  <details id="legend" open>
    <summary>Legend</summary>
    <div class="lg-row"><svg width="18" height="18"><path d="M9 1l8 8-8 8-8-8z" fill="#fff" stroke="#475569" stroke-width="1.5"/></svg> question</div>
    <div class="lg-row"><svg width="22" height="14"><rect x="1" y="1" width="20" height="12" rx="4" fill="#2563eb" stroke="#1e3a8a" stroke-width="1.5"/></svg> accepted</div>
    <div class="lg-row"><svg width="22" height="14"><rect x="1" y="1" width="20" height="12" rx="4" fill="#fff" stroke="#2563eb" stroke-width="1.5"/></svg> open</div>
    <div class="lg-row"><svg width="22" height="14"><rect x="1" y="1" width="20" height="12" rx="4" fill="#d1d5db" stroke="#9ca3af" stroke-width="1.5"/></svg> rejected <svg width="26" height="6"><line x1="0" y1="3" x2="26" y2="3" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 3"/></svg></div>
    <div class="lg-row tags"><span><b class="tb" style="background:#0d9488">D</b> definition</span><span><b class="tb" style="background:#7c3aed">T</b> math-tool</span><span><b class="tb" style="background:#d97706">M</b> method</span><span><b class="tb" style="background:#dc2626">P</b> physical hypothesis</span></div>
    <div class="lg-row muted">Border thickness = hold number h (hover to see it)</div>
  </details>
  <div id="tooltip" hidden></div>
  <div id="status" class="muted"></div>
</main>
<script src="vendor/cytoscape.min.js"></script>
<script src="vendor/dagre.min.js"></script>
<script src="vendor/cytoscape-dagre.js"></script>
<script src="app.js"></script>
</body>
</html>
